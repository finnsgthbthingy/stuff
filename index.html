<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <style>
        /* Base styles - Pitch Black */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #boot-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            color: #22c55e;
            font-size: 0.85rem;
            padding: 20px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            z-index: 10;
        }

        .boot-ok {
            color: #22c55e;
            font-weight: bold;
        }

        .boot-fail {
            color: #ef4444;
            font-weight: bold;
        }

        .boot-warn {
            color: #eab308;
            font-weight: bold;
        }

        .boot-info {
            color: #9ca3af;
        }

        #arg-interface {
            opacity: 0;
            visibility: hidden;
            transition: opacity 2s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 90%;
            max-width: 500px;
            z-index: 1;
        }

        
        .label {
            font-size: 1.2rem;
            color: #888888;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-transform: lowercase;
        }

        
        .input-group {
            display: flex;
            width: 100%;
            border-bottom: 1px solid #333333;
            transition: border-color 0.3s ease;
        }

        .input-group:focus-within {
            border-bottom-color: #ffffff;
        }

        
        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            padding: 8px 0;
            outline: none;
        }

        
        .submit-btn {
            background: transparent;
            border: none;
            color: #666666;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            padding: 8px 0 8px 12px;
            cursor: pointer;
            text-transform: lowercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .submit-btn:hover {
            color: #ffffff;
        }

        
        #response-log {
            margin-top: 25px;
            font-size: 1rem;
            color: #cccccc;
            line-height: 1.5;
            min-height: 30px;
            word-break: break-word;
        }

        
        #media-display {
            margin-top: 15px;
            width: 100%;
        }

        #media-display img,
        #media-display video {
            max-width: 100%;
            height: auto;
            border: 1px solid #333333;
            display: block;
        }

      
        #media-display video {
            pointer-events: none;
        }

        
        .visible {
            opacity: 1 !important;
            visibility: visible !important;
        }
    </style>
</head>
<body>

    <div id="boot-screen"></div>

    <div id="arg-interface">
        <label for="prompt-input" class="label">speak.</label>
        <div class="input-group">
            <input type="text" id="prompt-input" autocomplete="off" spellcheck="false" autofocus>
            <button id="submit-btn" class="submit-btn">submit</button>
        </div>
        <div id="response-log"></div>
        <div id="media-display"></div>
    </div>

const bootScreen = document.getElementById('boot-screen');
const interfaceContainer = document.getElementById('arg-interface');
const inputField = document.getElementById('prompt-input');
const submitBtn = document.getElementById('submit-btn');
const responseLog = document.getElementById('response-log');
const mediaDisplay = document.getElementById('media-display');

let activeAudio = null;
function runBootSequence() {
    let index = 0;
    
    const bootInterval = setInterval(() => {
        if (index < bootLogs.length) {
            const log = bootLogs[index];
            const line = document.createElement('div');
            
            
            const timestamp = `[ ${(index * 0.042183).toFixed(6)}] `;
            
            if (log.type === 'ok') {
                line.innerHTML = `<span class="boot-info">${timestamp}</span>[ <span class="boot-ok"> OK </span> ] ${log.text}`;
            } else if (log.type === 'fail') {
                line.innerHTML = `<span class="boot-info">${timestamp}</span>[<span class="boot-fail">FAILED</span>] ${log.text}`;
            } else if (log.type === 'warn') {
                line.innerHTML = `<span class="boot-info">${timestamp}</span>[ <span class="boot-warn">WARN</span> ] ${log.text}`;
            } else {
                line.innerHTML = `<span class="boot-info">${timestamp}${log.text}</span>`;
            }

            bootScreen.appendChild(line);
            bootScreen.scrollTop = bootScreen.scrollHeight; // Auto-scroll to bottom
            index++;
        } else {
            clearInterval(bootInterval);
            
            
            setTimeout(() => {
                bootScreen.style.display = 'none';
                interfaceContainer.classList.add('visible');
                inputField.focus();
            }, 1000);
        }
    }, 60);
}


runBootSequence();

const database = {

},
"findher.ogg": {
    sound: "https://raw.githubusercontent.com/finnsgthbthingy/stuff/main/Deltarune%20OST%20findher.ogg.mp3",
    text: "..."
},
    "default": {
        text: "Silence echoes back."
    }
};

function resetMedia() {
    if (activeAudio) {
        activeAudio.pause();
        activeAudio.currentTime = 0;
        activeAudio = null;
    }

    const existingVideo = mediaDisplay.querySelector('video');
    if (existingVideo) {
        existingVideo.pause();
        existingVideo.src = "";
        existingVideo.load();
    }

    mediaDisplay.innerHTML = '';
}

function handleSubmit() {
    const query = inputField.value.trim().toLowerCase();
    if (query === "") return;

    inputField.value = '';
    resetMedia();

    const entry = database[query] || database["default"];

    if (entry.sound) {
        activeAudio = new Audio(entry.sound);
        activeAudio.play().catch(e => console.log("Audio playback blocked:", e));
    }

    if (entry.gif) {
        const img = document.createElement('img');
        img.src = entry.gif;
        img.alt = "visual response";
        mediaDisplay.appendChild(img);
    }

    if (entry.video) {
        const video = document.createElement('video');
        video.src = entry.video;
        video.autoplay = true;
        video.playsInline = true;
        video.controls = false;
        
        video.play().catch(e => {
            console.log("Unmuted autoplay blocked, attempting muted playback:", e);
            video.muted = true;
            video.play();
        });

        mediaDisplay.appendChild(video);
    }

    typeResponse(entry.text || '');
}

submitBtn.addEventListener('click', handleSubmit);

inputField.addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
        handleSubmit();
    }
});

function typeResponse(text) {
    responseLog.textContent = '';
    let index = 0;
    
    const interval = setInterval(() => {
        if (index < text.length) {
            responseLog.textContent += text.charAt(index);
            index++;
        } else {
            clearInterval(interval);
        }
    }, 50);
}
</script>
